name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 (Release)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build solution
        run: msbuild UnrealEngineModLoader\UnrealEngineModLoader.sln /nologo /m /v:minimal /p:Configuration=Release /p:Platform=x64

      - name: List build output
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'

          # The projects use the default IntDir, which is the same folder as OutDir,
          # so filter out .obj/.tlog/.iobj/.lib and other intermediates.
          $out = 'UnrealEngineModLoader\x64\Release'
          $summary = @('### Build output', '')

          if (Test-Path $out) {
            $root = (Resolve-Path $out).Path
            $files = @(
              Get-ChildItem -Path $root -Recurse -File |
                Where-Object { $_.Extension -in '.dll', '.exe', '.pdb' -and $_.Name -notlike 'vc*.pdb' } |
                Sort-Object FullName
            )

            $summary += '| File | Size (KB) |'
            $summary += '| --- | --- |'
            foreach ($file in $files) {
              $relative = [System.IO.Path]::GetRelativePath($root, $file.FullName)
              $size = [math]::Round($file.Length / 1KB, 1)
              $summary += "| $relative | $size |"
            }

            $totalMb = [math]::Round(($files | Measure-Object Length -Sum).Sum / 1MB, 2)
            $summary += ''
            $summary += "$($files.Count) files, $totalMb MB total"

            $files | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 200
          }
          else {
            $summary += "No output folder at ``$out``"
            Write-Host "No output folder at $out"
          }

          $summary -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: UnrealModLoader-windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            UnrealEngineModLoader/x64/Release/*.dll
            UnrealEngineModLoader/x64/Release/*.exe
            UnrealEngineModLoader/x64/Release/*.pdb
            ModLoaderInfo.ini
